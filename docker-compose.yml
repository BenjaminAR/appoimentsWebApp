services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=4000
      - SWAGGER_UI=true
      - FRONTEND_URL=http://localhost:5173
      - TZ=America/Mexico_City
    command: sh -c "npm install --no-package-lock && node server.js"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_PORT=5173
    # --no-package-lock evita instalar dependencias nativas (p. ej. binarios de Rollup) resueltas para
    # el SO/arquitectura donde se generó package-lock.json (Windows/Mac), que rompen en el contenedor
    # Linux/alpine al cambiar de entorno; node_modules ya vive en un volumen aislado del host.
    command: sh -c "npm install --no-package-lock --include=optional && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules: