services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=4000
      - SWAGGER_UI=true
      - FRONTEND_URL=http://localhost:5173
      - TZ=America/Mexico_City
    command: sh -c "npm install && node server.js"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_PORT=5173
    command: sh -c "npm install --include=optional && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules: